name: Diferenciator 1.3.48 cleanup bootstrap

on:
  push:
    branches: [cleanup-1.3.48]
    paths:
      - ".github/workflows/cleanup-1.3.48-bootstrap.yml"

permissions:
  contents: write

jobs:
  prepare-cleanup-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: cleanup-1.3.48
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund --registry=https://registry.npmjs.org
      - name: Regenerate current assurance artifacts
        shell: bash
        run: |
          set -euo pipefail
          node scripts/generate-ai-assurance-fingerprint.mjs
          node scripts/generate-cyclonedx-sbom.mjs security/sbom/differentiator-1.3.48.cdx.json
      - name: Run cleanup prep audit
        shell: bash
        run: |
          set -euo pipefail
          out="security/evidence/master-cleanup-1.3.48-2026-09-18/prep-audit.txt"
          mkdir -p "$(dirname "$out")"
          {
            echo "Diferenciator 1.3.48 MASTER cleanup prep audit"
            echo "commit=$(git rev-parse HEAD)"
            echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo
            echo "[version]"
            node -e "const p=require('./package.json'); if(p.version!=='1.3.48') process.exit(1); console.log('package=1.3.48 PASS')"
            echo
            echo "[active-version-drift]"
            if grep -R -n --fixed-strings "1.3.47"               package.json package-lock.json ghrab-platform.consumer.json reporter-test.config.json               src/access src/ai-operations.json src/config src/index.template.html src/manual src/modules src/sw.js               scripts/qa-garp23-static.mjs scripts/qa-suite-session-lifecycle.mjs               --exclude='release-acceptance.json'; then
              echo "FAIL: active 1.3.47 reference remains"
              exit 1
            else
              echo "PASS: no stale 1.3.47 in active version-bearing scope"
            fi
            echo
            echo "[build]"
            npm run build
            test -f src/config/release-acceptance.json
            test ! -f dist/config/release-acceptance.json
            echo "PASS: source acceptance present; runtime acceptance absent"
            echo
            echo "[targeted-contracts]"
            node security/garp25/tools/selftest-garp251.mjs
            node scripts/verify-studio-manifest-contract.mjs
            node scripts/verify-promotion-workflow-architecture.mjs
            node scripts/test-ai-studio-dispatch.mjs
            node scripts/generate-ai-assurance-fingerprint.mjs --check
            echo
            echo "[sbom]"
            node -e "const s=require('./security/sbom/differentiator-1.3.48.cdx.json'); if(s.metadata?.component?.version!=='1.3.48') process.exit(1); console.log('PASS: SBOM version 1.3.48, components='+s.components.length)"
            echo
            echo "RESULT=PASS"
          } 2>&1 | tee "$out"
      - name: Commit regenerated evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add security/evidence/ai-assurance-fingerprint.json                   security/sbom/differentiator-1.3.48.cdx.json                   security/evidence/master-cleanup-1.3.48-2026-09-18/prep-audit.txt
          if git diff --cached --quiet; then
            echo "No generated evidence changes."
            exit 0
          fi
          git commit -m "audit: regenerate 1.3.48 cleanup assurance evidence"
          git push origin HEAD:cleanup-1.3.48

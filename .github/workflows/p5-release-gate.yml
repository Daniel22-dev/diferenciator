name: P5 R2 pre-production release gate

on:
  workflow_dispatch:
  push:
    branches: [candidate, main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: p5-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' || github.ref != 'refs/heads/main' }}

jobs:
  p5-release-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund --registry=https://registry.npmjs.org
      - name: Verify pinned audit tools
        run: |
          node -e "const p=require('./node_modules/axe-core/package.json'); if(p.version!=='4.12.1') process.exit(1)"
          node -e "const p=require('./node_modules/playwright/package.json'); if(p.version!=='1.61.1') process.exit(1)"
      - name: Run repository secret scan
        run: npm run qa:secrets
      - name: Restore exact Playwright Chromium cache
        id: playwright-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-1.61.1-${{ hashFiles('package-lock.json') }}
      - name: Install Playwright Chromium system dependencies
        shell: bash
        run: |
          set -euo pipefail
          npx playwright install-deps chromium
      - name: Install pinned Playwright Chromium on cache miss
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          npx playwright install --no-shell chromium
      - name: Verify pinned Playwright Chromium
        shell: bash
        run: |
          set -euo pipefail
          CHROMIUM_PATH="$(node -e "process.stdout.write(require('playwright').chromium.executablePath())")"
          if [ ! -x "$CHROMIUM_PATH" ]; then
            echo "::warning::Playwright cache was unusable; reinstalling the exact pinned Chromium."
            rm -rf "$HOME/.cache/ms-playwright"
            npx playwright install --no-shell chromium
            CHROMIUM_PATH="$(node -e "process.stdout.write(require('playwright').chromium.executablePath())")"
          fi
          test -x "$CHROMIUM_PATH"
          case "$CHROMIUM_PATH" in
            "$HOME/.cache/ms-playwright/"*) ;;
            *) echo "::error::Unexpected Playwright browser path: $CHROMIUM_PATH"; exit 1 ;;
          esac
          "$CHROMIUM_PATH" --version
          echo "CHROMIUM_PATH=$CHROMIUM_PATH" >> "$GITHUB_ENV"
      - name: Install PDF audit dependencies
        shell: bash
        run: |
          sudo apt-get install -y --no-install-recommends poppler-utils
          pdftotext -v
      - name: Run P5 core and GARP 2.7 Foundation in isolated parallel worktrees
        run: node scripts/run-p5-foundation-parallel.mjs
        env:
          GARP27_EXTERNAL_TRUST_SHA256: 38f7710f732d745ddbb099f478ee9c1c004d467c40fbcd148b5d0e756b941ef1
      - name: Validate final Pages release identity
        run: npm run prepare:pages
      - name: Upload audit evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: p5-r2-${{ github.sha }}
          path: |
            qa-results
            audit/evidence/garp27-current
            dist/qa-p5-*.json
            dist/qa-p3-browser-report.json
            dist/quality-report.json

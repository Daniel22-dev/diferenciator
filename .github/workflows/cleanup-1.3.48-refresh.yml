name: Diferenciator 1.3.48 evidence refresh #2

on:
  push:
    branches: [cleanup-1.3.48]
    paths:
      - ".github/workflows/cleanup-1.3.48-refresh.yml"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: cleanup-1.3.48
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci --ignore-scripts --no-audit --no-fund --registry=https://registry.npmjs.org
      - name: Refresh fingerprint and verify cleanup budget
        shell: bash
        run: |
          set -euo pipefail
          node scripts/generate-ai-assurance-fingerprint.mjs
          npm run build
          node scripts/qa-p3-quality.mjs
          test ! -f dist/config/release-acceptance.json
      - name: Commit refreshed fingerprint
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add security/evidence/ai-assurance-fingerprint.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "audit: refresh 1.3.48 AI assurance fingerprint"
          git push origin HEAD:cleanup-1.3.48

name: Build and deploy after P5 R2

on:
  workflow_run:
    workflows: ["P5 R2 pre-production release gate"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund --registry=https://registry.npmjs.org
      - name: Build deploy artifact
        run: npm run build
      - name: Verify platform conformance of deploy artifact
        run: npm run qa:platform
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment_1.outputs.page_url || steps.deployment_2.outputs.page_url || steps.deployment_3.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages (attempt 1/3)
        id: deployment_1
        continue-on-error: true
        uses: actions/deploy-pages@v5

      - name: Wait before Pages retry 2
        if: steps.deployment_1.outcome == 'failure'
        shell: bash
        run: sleep 60

      - name: Deploy to GitHub Pages (attempt 2/3)
        id: deployment_2
        if: steps.deployment_1.outcome == 'failure'
        continue-on-error: true
        uses: actions/deploy-pages@v5

      - name: Wait before Pages retry 3
        if: steps.deployment_1.outcome == 'failure' && steps.deployment_2.outcome == 'failure'
        shell: bash
        run: sleep 180

      - name: Deploy to GitHub Pages (attempt 3/3)
        id: deployment_3
        if: steps.deployment_1.outcome == 'failure' && steps.deployment_2.outcome == 'failure'
        continue-on-error: true
        uses: actions/deploy-pages@v5

      - name: Enforce successful Pages deployment
        if: steps.deployment_1.outcome != 'success' && steps.deployment_2.outcome != 'success' && steps.deployment_3.outcome != 'success'
        shell: bash
        run: |
          echo "::error::GitHub Pages deployment failed after 3 bounded attempts. P5 R2 already passed; build and artifact upload succeeded, but the Pages service remained unavailable or returned a non-recoverable error."
          exit 1
